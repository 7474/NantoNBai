name: E2E
on:
  workflow_run:
    workflows:
      - CD
    branches:
      - master
    types: 
      - completed
  workflow_dispatch:
env:
  DOTNET_VERSION: 10.x.x
jobs:
  e2e:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    
    # - uses: actions/setup-node@v3
    # - name: Install playwright browsers
    #   run: npx playwright install-deps chromium

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - run: dotnet restore E2ETest/E2ETest.csproj
    - run: dotnet build E2ETest/E2ETest.csproj --no-restore
    - run: pwsh E2ETest/bin/Debug/net10.0/playwright.ps1 install --with-deps
    - run: dotnet test E2ETest/E2ETest.csproj --no-build --verbosity normal
  
    - name: Check result
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-result
        path: E2ETest/bin
